[project]
name = "jobagent"
version = "0.1.0"
description = "Multi-user, BYOK, dry-run-by-default job search agent for Dublin"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27","pydantic>=2.7","sqlalchemy>=2.0","alembic>=1.13","cryptography>=42","anthropic>=0.34","typer>=0.12","pyyaml>=6","pypdf>=4","python-docx>=1.1","fastapi>=0.110","uvicorn>=0.29","jinja2>=3.1","python-multipart>=0.0.9","psycopg[binary]>=3.1"]
[project.optional-dependencies]
dev = ["pytest>=8","pytest-asyncio>=0.23","respx>=0.21","ruff>=0.5"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobagent = ["web/templates/*.html"]

[project.scripts]
jobagent = "jobagent.cli:app"
