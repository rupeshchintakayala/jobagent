<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Job agent{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202b;--mut:#64748b;--line:#e2e8f0;--pri:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
nav{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;font-weight:500}nav a:hover{color:var(--pri)}nav .brand{font-weight:700}nav .sp{flex:1}
main{max-width:860px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 12px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
label{display:block;font-weight:600;margin:12px 0 4px}input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:70px}input[type=file]{padding:7px}
.btn{display:inline-block;background:var(--pri);color:#fff;border:0;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn:hover{opacity:.9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut);font-size:13px}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:14px;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.flash.err{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e2e8f0}
.pill.good{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}
.steps{list-style:none;padding:0;margin:0}.steps li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.steps li:last-child{border:0}
.dot{width:22px;height:22px;border-radius:50%;background:#e2e8f0;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}.dot.done{background:var(--ok);color:#fff}
.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri)}.bar.hot>i{background:var(--warn)}
pre{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit}.stat b{display:block;font-size:24px}
.score{font-size:20px;font-weight:700;color:var(--pri)}
</style></head><body>
<nav><span class="brand">Job agent</span>
{% if user %}<a href="/dashboard">Home</a><a href="/queue">Review queue</a><a href="/profile">Profile</a><a href="/policies">Company limits</a><a href="/settings">Settings</a><span class="sp"></span>
<span class="mut">{{ user.email }}</span>
<form method="post" action="/logout" style="margin:0"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn sec" style="padding:6px 12px">Log out</button></form>
{% else %}<span class="sp"></span><a href="/login">Log in</a><a href="/signup">Sign up</a>{% endif %}</nav>
<main>
{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}{% if err %}<div class="flash err">{{ err }}</div>{% endif %}
{% block body %}{% endblock %}
</main></body></html>
