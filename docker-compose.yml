services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jobagent
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: always
    depends_on:
      db: {condition: service_healthy}
    environment:
      JOBAGENT_DB: postgresql://jobagent:${POSTGRES_PASSWORD}@db:5432/jobagent
      JOBAGENT_MASTER_KEY: ${JOBAGENT_MASTER_KEY}
      JOBAGENT_SESSION_SECRET: ${JOBAGENT_SESSION_SECRET}
      JOBAGENT_COOKIE_SECURE: "1"
      JOBAGENT_SCHEDULE_HOURS: "24"
      JOBAGENT_INVITE_CODE: ${JOBAGENT_INVITE_CODE:-}
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  pgdata:
  caddy_data:
